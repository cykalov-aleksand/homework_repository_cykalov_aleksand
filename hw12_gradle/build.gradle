plugins {
    id 'java'
}

group = 'org.example'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':hw10_gradle')
    implementation project(':hw11_gradle')
    implementation 'org.hibernate.orm:hibernate-core:7.4.7.Final'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    runtimeOnly 'ch.qos.logback:logback-classic:1.6.3'
    implementation 'org.eclipse.jetty:jetty-server:12.1.13'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.13'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-webapp:12.1.13'
    //implementation 'org.eclipse.jetty:jetty-servlet:11.0.26'
   // implementation 'tools.jackson.core:jackson-databind:3.2.2'
   implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.freemarker:freemarker:2.3.35'


    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}