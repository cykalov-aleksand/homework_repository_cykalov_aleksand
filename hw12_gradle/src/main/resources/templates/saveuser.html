<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать клиента</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, textarea { width: 300px; padding: 6px; margin-top: 4px; }
        button { margin-top: 16px; padding: 8px 16px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Создать клиента (CRM)</h1>

    <form id="clientForm">
        <label for="name">Имя клиента (обязательно):</label>
        <input type="text" id="name" name="name" required placeholder="Ivan Ivanov">

        <label for="street">Улица:</label>
        <input type="text" id="street" name="street" placeholder="Lenina 1">

        <label for="phones">Телефоны (каждый с новой строки):</label>
        <textarea id="phones" name="phones" rows="4" placeholder="+79990001122&#10;+79993334455"></textarea>

        <button type="submit">Сохранить</button>
    </form>

    <div id="result" class="result" style="display:none;"></div>

    <script>
        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const street = document.getElementById('street').value.trim();
            const phonesRaw = document.getElementById('phones').value.trim();

            // Превращаем многострочный ввод в массив номеров
            const phoneNumbers = phonesRaw
                .split(/\r?\n/)
                .map(p => p.trim())
                .filter(p => p !== '');

            if (!name) {
                showResult('Ошибка: поле "Имя" обязательно.', false);
                return;
            }

            const payload = {
                name: name,
                street: street,
                phoneNumbers: phoneNumbers
            };

            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    showResult(
                        `✅ Клиент сохранён! ID: ${data.id}, имя: ${data.name}.` +
                        `<br><a href="/user/${data.id}">Перейти к карточке клиента</a>`,
                        true
                    );
                    // Очистить форму
                    document.getElementById('clientForm').reset();
                } else {
                    const errorMsg = data.error || 'Неизвестная ошибка';
                    showResult(`❌ Ошибка: ${errorMsg}`, false);
                }
            } catch (err) {
                console.error(err);
                showResult(`❌ Ошибка сети: ${err.message}`, false);
            }
        });

        function showResult(text, isSuccess) {
            const el = document.getElementById('result');
            el.style.display = 'block';
            el.innerHTML = text;
            el.className = 'result ' + (isSuccess ? 'success' : 'error');
        }
    </script>
</body>
</html>
