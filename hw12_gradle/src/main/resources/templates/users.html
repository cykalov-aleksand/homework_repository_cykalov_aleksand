<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <style>
        table { border-collapse: collapse; width: 60%; margin: 20px auto; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .empty-msg { text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>
<h1 style="text-align:center;">Список клиентов</h1>

<#if clients?has_content>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Login</th>
        <th>Name</th>
    </tr>
    </thead>
    <tbody>
    <#list clients as client>
    <tr>
        <td>${client.id}</td>
        <td>${client.login!'N/A'}</td>
        <td>${client.name!'No name'}</td>
    </tr>
    </#list>
    </tbody>
</table>
<#else>
<p class="empty-msg">Клиенты не найдены. Добавь данные в базу (через миграцию или API).</p>
</#if>
</body>
</html>
