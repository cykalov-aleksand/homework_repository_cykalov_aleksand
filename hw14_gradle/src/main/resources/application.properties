spring.application.name=hw14_gradle
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5430/demoDB
spring.datasource.username=usr
spring.datasource.password=pwd
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true

spring.flyway.password=pwd
spring.flyway.user=usr
spring.flyway.url=jdbc:postgresql://localhost:5430/demoDB
spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.data.jdbc.core.JdbcAggregateTemplate=DEBUG


