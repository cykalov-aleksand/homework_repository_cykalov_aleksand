<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список клиентов</title>
</head>
<body>
<h1>Клиенты</h1>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Адрес</th>
        <th>Телефоны</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <!-- Сообщение, если список пустой -->
    <tr th:if="${#lists.isEmpty(clients)}">
        <td colspan="6">Клиентов пока нет</td>
    </tr>

    <!-- Строки с клиентами -->
    <tr th:each="client : ${clients}">
        <td th:text="${client.id}"></td>
        <td th:text="${client.name != null ? client.name : '—'}"></td>
        <td th:text="${client.addressStreet != null ? client.addressStreet : '—'}"></td>

        <td>
            <span th:if="${#lists.isEmpty(client.phoneNumbers)}">—</span>
            <span th:unless="${#lists.isEmpty(client.phoneNumbers)}" th:remove="tag">
                <span th:each="number : ${client.phoneNumbers}"
                      th:text="${number}"
                      th:remove="tag"></span>
            </span>
        </td>

        <!-- Действия: Редактировать + Удалить -->
        <td>
            <!-- Кнопка редактирования -->
            <a th:href="@{/clients/{id}/edit(id=${client.id})}" class="btn" style="margin-right: 5px;">Редактировать</a>

            <!-- Форма удаления -->
            <form th:action="@{/clients/{id}/delete(id=${client.id})}"
                  method="POST"
                  onsubmit="return confirm('Вы уверены, что хотите удалить клиента ID ' + ${client.id} + '?');">
                <button type="submit" class="btn btn-danger">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- Ссылка на создание нового (для полноты картины) -->
<p><a th:href="@{/clients/new}" class="btn btn-primary">Добавить клиента</a></p>
</body>
</html>
