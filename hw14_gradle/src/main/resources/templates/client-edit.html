<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<form th:action="@{/clients}" method="post" th:object="${clientDto}">
        <!-- Скрытое поле с ID клиента -->
    <input type="hidden" th:field="*{id}" />

    <!-- Скрытое поле с ID адреса (чтобы сервис знал, какой обновлять) -->
    <input type="hidden" th:field="*{addressId}" />

    <div>
        <label>Имя:</label>
        <input type="text" th:field="*{name}" placeholder="Введите имя" required />
    </div>

    <div>
        <label>Адрес (улица):</label>
        <!-- Теперь тут будет подставлена улица из существующего адреса -->
        <input type="text" th:field="*{addressStreet}" placeholder="Улица" required />
    </div>

    <div>
        <label>Телефоны:</label>
        <textarea th:field="*{phoneNumbersStr}" rows="3" cols="40"
                  placeholder="Например: +7999..., +7900..."></textarea>
    </div>

    <button type="submit">Сохранить</button>
    <a href="/clients">Отмена</a>
</form>
