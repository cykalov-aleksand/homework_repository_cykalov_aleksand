<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${clientDto.id == null ? 'Новый клиент' : 'Редактирование клиента'}">Новый клиент</title>
    <style>
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        /* Блок для пары label + input */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column; /* label сверху, input снизу */
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;       /* Растягиваем поле на всю ширину контейнера */
            max-width: 200px;  /* Ограничиваем максимальную ширину, чтобы не было слишком широко */
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<!-- Блок для ошибок валидации -->
<div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}"></span>
</div>

<div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}"></span>
</div>

<h1 th:text="${clientDto.id == null ? 'Новый клиент' : 'Редактирование клиента'}"></h1>


<form th:action="@{/clients}" th:object="${clientDto}" method="post">

    <!-- Блок ошибок (единый для всех случаев) -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div th:if="${message}" class="alert alert-success">
        <span th:text="${message}"></span>
    </div>
    <div class="form-group">
    <!-- Поле имени -->
    <label for="name">Имя:</label>
    <!-- th:field автоматически берет значение из clientDto благодаря @SessionAttributes -->
    <input type="text" th:field="*{name}" id="name" class="form-control" />
    </div>
    <div class="form-group">
    <!-- Поле адреса -->
    <label for="addressStreet">Адрес:</label>
    <input type="text" th:field="*{addressStreet}" id="addressStreet" class="form-control" />
    </div>
    <div class="form-group">
    <!-- Поле телефонов (текстовое поле для ввода через запятую) -->
    <label for="phoneNumbersStr">Телефоны (через запятую):</label>
    </div>
    <textarea name="phoneNumbersStr" id="phoneNumbersStr" rows="3" class="form-control" th:value="${phoneNumbersStr}">
    </textarea>

    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
</body>
</html>
