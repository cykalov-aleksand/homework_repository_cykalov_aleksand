<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<head>
    <title th:text="${clientDto.id == null ? 'Новый клиент' : 'Редактирование клиента'}">Новый клиент</title>
     <style>
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<!-- Блок для ошибок валидации (например, «Имя клиента обязательно») -->
<div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

<!-- Блок для успешных сообщений (если вдруг попадёт сюда после редиректа — редко, но бывает) -->
<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

<h1 th:text="${clientDto.id == null ? 'Новый клиент' : 'Редактирование клиента'}"></h1>

<form th:object="${clientDto}" th:action="@{/clients}" method="post">

    <!-- Скрытый ID для редактирования -->
    <input type="hidden" th:field="*{id}" />

    <div>
        <label>Имя:
           <!--  <input type="text" th:field="*{name}" required placeholder="Например: Иван Иванов" />  -->
            <input type="text" th:field="*{name}" placeholder="Например: Иван Иванов" />
        </label>
    </div>

    <div>
        <label>Адрес (улица и дом):
            <input type="text" th:field="*{addressStreet}" placeholder="Например: Москва, ул. Пушкина, 10" />
        </label>
    </div>

    <div>
        <label>Телефоны (через запятую, например: 79990000001, 79990000002):
            <input type="text" th:field="*{phoneNumbersStr}" placeholder="Номера телефонов" />
        </label>
    </div>

    <button type="submit">Сохранить</button>
    <a th:href="@{/clients}">Отмена</a>
</form>

</body>
</html>
