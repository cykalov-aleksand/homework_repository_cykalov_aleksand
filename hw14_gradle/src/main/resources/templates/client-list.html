<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список клиентов</title>
</head>
<body>
<h1>Клиенты</h1>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Адрес (ID)</th>
        <th>Телефоны</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.id}"></td>
        <td th:text="${client.name}"></td>

        <!-- Адрес: показываем ID, потому что в списке address = null -->
        <td>
            <span th:text="${client.addressId != null} ? ${client.addressId} : '—'">—</span>
        </td>

        <!-- Телефоны: только ссылка, чтобы подгрузить их на странице клиента -->
        <td>
            <a th:href="@{/clients/{id}(id=${client.id})}"
               style="text-decoration: none; color: #007bff;">
                Посмотреть номера
            </a>
        </td>

        <td>
            <a th:href="@{/clients/{id}(id=${client.id})}" class="btn">Подробнее</a>
        </td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/clients/new}">Добавить</a></p>
</body>
</html>
