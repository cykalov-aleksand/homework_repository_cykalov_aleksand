plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = 'unspecified'

repositories {
    mavenCentral()
}

application {
    mainClass = 'org.example.cache_demo.CacheDemo'
    applicationDefaultJvmArgs = ['-Xmx128m', '-Xms64m']
}

dependencies {
    implementation 'org.hibernate.orm:hibernate-core:7.4.7.Final'
    implementation project(':hw10_gradle')
    implementation 'org.slf4j:slf4j-api:2.0.18'
    runtimeOnly 'ch.qos.logback:logback-core:1.5.35'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.35'
    implementation 'org.ehcache:ehcache:3.12.0'

    testImplementation 'com.h2database:h2:2.5.250'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
}

test {
    useJUnitPlatform()
}